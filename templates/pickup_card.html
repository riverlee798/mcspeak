<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>mcspeak · pickup card</title>
<style>
  :root{--red:#D0021B;--yellow:#FFC72C;--ink:#0B0B0B;--muted:#525252;--line:#DDD;--ok:#0B6B2F;
        --page:#ECECEC;--bg:#fff;
        --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",
               "Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",
               "Noto Sans Arabic","Noto Sans Thai","Noto Sans Devanagari",Tahoma,Arial,sans-serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font)}
  .wrap{max-width:1000px;margin:0 auto;padding:10px}
  .card{background:var(--bg);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.10)}
  .hd{display:flex;gap:10px;align-items:center;border-bottom:4px solid var(--ink);padding-bottom:10px}
  .hd .logo{width:42px;height:42px;border-radius:10px;background:var(--red);color:#fff;display:flex;
            align-items:center;justify-content:center;font-size:22px;font-weight:900}
  .hd .st{font-size:15px;font-weight:900;line-height:1.25}
  .hd .st i{display:block;font-size:12px;color:var(--muted);font-style:normal;font-weight:700;margin-top:2px}
  .row{display:grid;grid-template-columns:1fr;gap:3px;padding:11px 0;border-bottom:2px solid var(--line);
       align-items:start;direction:ltr}
  .row .zh{font-size:clamp(21px,5.4vw,29px);font-weight:900;line-height:1.32}
  .row .loc{font-size:clamp(14px,3.5vw,17px);font-weight:700;line-height:1.42;color:var(--muted)}
  .row .loc[dir="rtl"]{text-align:right}
  @media (min-width:640px) and (orientation:landscape){
    .row{grid-template-columns:1fr 1fr;gap:20px}
    .row .zh{padding-inline-end:18px;border-inline-end:3px solid var(--line)}
  }
  .num{display:inline-flex;width:1.5em;height:1.5em;border-radius:50%;background:var(--ink);color:#fff;
       font-size:.72em;align-items:center;justify-content:center;margin-inline-end:8px;font-weight:900}
  .sub{font-size:.62em;font-weight:700;color:var(--muted);margin-top:3px}
  .cust{color:var(--red)}
  .sec{border-top:4px solid var(--ink);margin-top:14px;padding-top:10px}
  .sec .ttl{font-size:14px;font-weight:900;color:var(--muted);margin:0 0 8px}
  .sec .ttl b{color:var(--ink);font-size:15px}

  /* 取餐码：整页最醒目，但仍是一个双语格子 */
  .code{border:5px solid var(--ink);border-radius:16px;padding:10px 12px;margin-top:10px;text-align:center}
  .code .zh{font-size:clamp(18px,4.6vw,24px);font-weight:900;color:var(--muted)}
  .code .no{font-size:clamp(72px,22vw,140px);line-height:.98;font-weight:900;letter-spacing:.07em;
            font-variant-numeric:tabular-nums;margin:4px 0}
  .code .loc{font-size:clamp(15px,3.8vw,18px);font-weight:800;color:var(--muted)}
  .sampletag{display:inline-block;background:var(--yellow);border:2px solid var(--ink);border-radius:6px;
             padding:1px 8px;font-size:12px;font-weight:900;margin-top:6px}

  .price{display:grid;grid-template-columns:1fr;gap:2px;padding:12px;border:4px solid var(--ink);
         border-radius:12px;margin-top:10px}
  .price .zh{font-size:clamp(24px,6.2vw,32px);font-weight:900}
  .price .loc{font-size:15px;font-weight:800;color:var(--muted)}

  /* App 模拟：顶部状态 + 底部三按钮（从左到右 取消/客服/支付） */
  .appmock{border:4px solid var(--ink);border-radius:14px;padding:10px;margin-top:10px;background:#FAFAFA}
  .appmock .astatus{font-size:clamp(20px,5vw,26px);font-weight:900;text-align:center;padding:8px 4px}
  .appmock .astatus .al{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-top:2px}
  .apills{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
  .pill{border-radius:999px;padding:9px 6px;text-align:center;border:3px solid var(--ink);background:#fff}
  .pill .pzh{display:block;font-size:clamp(12px,3.2vw,15px);font-weight:900;line-height:1.2}
  .pill .ploc{display:block;font-size:clamp(10px,2.6vw,12px);font-weight:700;color:var(--muted);
              margin-top:2px;line-height:1.2}
  .pill .pos{display:block;font-size:10px;font-weight:700;color:#8A0011;margin-top:4px;line-height:1.2}
  .pill.yellow{background:var(--yellow)}
  .pill.yellow .ploc{color:#5A4300}

  table.st{width:100%;border-collapse:collapse}
  table.st td{padding:9px 6px;border-bottom:1px solid #EEE;font-size:14px;font-weight:700;vertical-align:middle}
  table.st td.s{font-size:15px;font-weight:900}
  table.st tr.hot{background:#EAF7EE}
  table.st tr.hot td{font-size:17px;font-weight:900}
  table.st tr.hot td.s{font-size:18px}

  .steps{padding-inline-start:1.1em;margin:4px 0 0}
  .steps li{font-size:15px;font-weight:700;line-height:1.45;margin:8px 0}
  .zhbig{border:4px solid var(--ink);border-radius:14px;padding:12px;margin-top:10px}
  .zhbig .zh{font-size:clamp(22px,5.6vw,30px);font-weight:900;line-height:1.34}
  .zhbig .no{font-size:clamp(34px,10vw,52px);font-weight:900;letter-spacing:.08em;margin-top:4px}
  .zhbig .loc{font-size:13px;font-weight:700;color:var(--muted);margin-top:4px}

  .btns{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
  @media(min-width:680px){.btns{grid-template-columns:1fr 1fr}}
  .btn{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:10px 14px;border-radius:12px;
       border:3px solid var(--ink);background:#fff;color:var(--ink);font-family:inherit;cursor:pointer;text-align:start}
  .btn .bi{font-size:21px}
  .btn .bl{flex:1 1 auto;display:grid;gap:1px}
  .btn .bzh{font-size:17px;font-weight:900;line-height:1.2}
  .btn .bloc{font-size:13px;font-weight:700;color:var(--muted);line-height:1.2}
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff}
  .btn.primary .bloc{color:#FFE9E9}
  .btn.yellow{background:var(--yellow)}
  .ov{position:fixed;inset:0;background:#fff;z-index:99;display:none;flex-direction:column;padding:14px;overflow:auto}
  .ov.on{display:flex}
  .ov .bignum{font-size:clamp(30px,9vw,54px);font-weight:900;line-height:1.25;margin:18px 0 6px}
  .ov .small{font-size:clamp(17px,4.4vw,21px);font-weight:800;color:var(--muted);line-height:1.4}
  .foot{margin-top:12px;font-size:12px;color:var(--muted);text-align:center}
  .warn{background:#FFF1F1;border:3px solid var(--red);color:#8A0011;border-radius:12px;padding:10px 12px;
        margin-top:10px;font-size:15px;font-weight:800}
  @media print{.btns,.ov{display:none!important}}
  .cnote{margin-top:6px;padding-top:6px;border-top:2px dashed var(--ink);text-align:center}
  .cnote .cz{display:block;font-size:clamp(13px,3.4vw,16px);font-weight:900;line-height:1.3}
  .cnote .loc{font-size:clamp(11px,2.9vw,13px)!important;margin-top:2px}
  .vw{font-weight:900}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app"></div></div>
<div class="ov" id="ov"><div id="ovBody"></div></div>
<script id="card-data" type="application/json">/*__DATA__*/</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById('card-data').textContent);
  var U=D.ui||{},Z=D.zhui||{}, app=document.getElementById('app');
  var ov=document.getElementById('ov'), ovB=document.getElementById('ovBody');
  function esc(s){return String(s==null?'':s).replace(/\*\*/g,'').replace(/&/g,'&amp;')
      .replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function cell(zhHtml,local,cls){
    return '<div class="row '+(cls||'')+'"><div class="zh">'+zhHtml+'</div>'+
      '<div class="loc" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(local)+'</div></div>';
  }
  function sec(t,inner){return '<div class="sec"><div class="ttl">'+t+'</div>'+inner+'</div>';}
  function btn(o,cls,fn,icon){
    var b=document.createElement('button'); b.className='btn '+(cls||'');
    b.innerHTML='<span class="bi">'+(icon||'')+'</span><div class="bl"><span class="bzh">'+esc(o.zh)+
      '</span><span class="bloc" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(o.local)+'</span></div>';
    b.onclick=fn; return b;
  }

  var h='<div class="hd"><div class="logo">M</div><div class="st">'+esc(D.store.zh)+
        '<i>'+esc(D.store.pinyin)+'</i></div></div>';
  var gen=Date.parse(String(D.generatedAt||'').replace(' ','T'));
  if(!isNaN(gen)&&(Date.now()-gen)/60000>=30){h+='<div class="warn">⚠️ '+esc(U.stale)+'</div>';}
  h+=cell(esc(D.howto.zh),D.howto.local);
  h+='<div class="code"><div class="zh">🎫 '+esc(D.pickup.zh)+'</div>'+
     '<div class="no">'+esc(D.pickup.code)+'</div>'+
     '<div class="loc" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(D.pickup.local)+'</div>'+
     (D.pickup.note?'<div class="cnote"><span class="cz">'+esc(U.codeNote)+'</span>'+
        '<span class="loc" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(D.pickup.note)+'</span></div>':'')+
     (D.isSample?'<div class="sampletag">'+esc(U.sampleTag)+'</div>':'')+'</div>';
  app.innerHTML=h;

  var inner='';
  (D.items||[]).forEach(function(it){
    inner+=cell('<span class="num">'+esc(it.n)+'</span>'+esc(it.zh)+' <span class="sub">×'+esc(it.qty)+'</span>'+
      (it.combosZh?'<div class="sub">'+esc(it.combosZh)+'</div>':''), it.local, '');
    (it.customs||[]).forEach(function(c){
      inner+=cell('<span class="num">'+esc(it.n)+'</span><span class="cust">'+esc(c.zh)+'</span>', c.local, '');
    });
  });
  app.insertAdjacentHTML('beforeend', sec('<b>我点的东西</b> · '+esc(D.sec.order), inner));
  app.insertAdjacentHTML('beforeend', sec('<b>就餐与付款</b> · '+esc(D.sec.facts),
    (D.facts||[]).map(function(f){return cell('<span>'+esc(f.icon)+' </span>'+esc(f.zh), f.local,'');}).join('')));

  if(D.price){
    var p='<div class="price"><div class="zh">'+esc(D.price.zhLabel)+' '+esc(D.price.amount)+'</div>'+
          '<div class="loc" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(D.price.local)+'</div>';
    if(D.price.saved){p+='<div class="loc" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(D.price.saved)+'</div>';}
    if(D.price.coupons){p+='<div class="loc" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(D.price.coupons)+'</div>';}
    app.insertAdjacentHTML('beforeend', p+'</div>');
  }

  /* App 模拟：状态 + 底部三个按钮 */
  if(D.appStatus){
    var am='<div class="appmock"><div class="astatus">'+esc(D.appStatus.zh)+
      '<span class="al" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(D.appStatus.local)+'</span></div><div class="apills">';
    (D.appVocab||[]).forEach(function(v){
      am+='<div class="pill '+(v.style||'outline')+'"><span class="pzh">'+esc(v.zh)+'</span>'+
          '<span class="ploc" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(v.local)+'</span>'+
          '<span class="pos" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(v.pos)+'</span></div>';
    });
    am+='</div></div>';
    app.insertAdjacentHTML('beforeend', sec('<b>麦当劳 App 上的样子</b> · '+esc(D.sec.app), am));
  }

  /* 非状态类的 App 字样 */
  if(D.vocabRows&&D.vocabRows.length){
    app.insertAdjacentHTML('beforeend', sec('<b>App 里的字样</b> · '+esc(D.sec.app),
      D.vocabRows.map(function(v){
        return cell('<span class="vw">'+esc(v.zh)+'</span>', v.local, '');
      }).join('')));
  }

  /* 状态对照 */
  if(D.statusRows&&D.statusRows.length){
    var t='<table class="st">'+D.statusRows.map(function(r){
      return '<tr class="'+(r.hot?'hot':'')+'"><td class="s"'+(r.zh?' lang="zh-CN" dir="ltr"':'')+'>'+
        (r.hot?'🍟 ':'')+esc(r.zh)+'</td><td lang="'+D.lang+'" dir="'+D.dir+'">'+esc(r.local)+'</td>'+
        '<td lang="'+D.lang+'" dir="'+D.dir+'">'+esc(r.action)+'</td></tr>';
    }).join('')+'</table>';
    app.insertAdjacentHTML('beforeend', sec('<b>订单状态</b> · '+esc(D.sec.status), t));
  }

  /* 取餐步骤 */
  if(D.steps){
    app.insertAdjacentHTML('beforeend', sec('<b>怎么取餐</b> · '+esc(D.sec.steps),
      D.steps.map(function(s,i){
        return cell('<span class="num">'+(i+1)+'</span>'+esc(s.zh), s.local, '');
      }).join('')));
  }

  /* 按钮 */
  var bb=document.createElement('div'); bb.className='btns';
  var sp=document.createElement('button'); sp.className='btn primary';
  sp.innerHTML='<span class="bi">🔊</span><div class="bl"><span class="bzh">朗读</span>'+
    '<span class="bloc" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(U.speak)+'</span></div>';
  sp.onclick=function(){
    if(!('speechSynthesis' in window))return;
    var t=D.howto.zh;
    try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);
        u.lang='zh-CN';u.rate=0.8;window.speechSynthesis.speak(u);}catch(e){}
  };
  bb.appendChild(sp);
  (D.sayCustomer||[]).slice(0,3).forEach(function(s){
    bb.appendChild(btn(s,'yellow',function(){ openSay(s); },'🗣️'));
  });
  app.appendChild(bb);

  function backBtn(){
    var b=document.createElement('button'); b.className='btn';
    b.innerHTML='<span class="bi">‹</span><div class="bl"><span class="bzh">'+esc(Z.back||'返回')+
      '</span><span class="bloc" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(U.back)+'</span></div>';
    b.onclick=function(){ov.classList.remove('on');document.body.style.overflow='';};
    return b;
  }
  function openSay(s){
    ovB.innerHTML=''; ov.classList.add('on'); document.body.style.overflow='hidden';
    ovB.insertAdjacentHTML('beforeend',
      '<div class="bignum" lang="zh-CN" dir="ltr">'+esc(s.zh)+'</div>'+
      '<div class="small" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(s.local)+'</div>');
    ovB.appendChild(backBtn());
  }

  var f=document.createElement('div'); f.className='foot';
  f.innerHTML=(D.isSample?esc(U.sampleNote)+' · ':'')+'🕒 '+esc(D.generatedAt)+' · mcspeak';
  app.appendChild(f);
  document.documentElement.setAttribute('lang',D.lang||'en');
})();
</script>
</body>
</html>
