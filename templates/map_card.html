<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>mcspeak · map card</title>
<style>
  :root{--red:#D0021B;--yellow:#FFC72C;--ink:#0B0B0B;--muted:#525252;--line:#DDD;
        --page:#ECECEC;--bg:#fff;--ok:#0B6B2F;
        --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",
               "Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",
               "Noto Sans Arabic","Noto Sans Thai","Noto Sans Devanagari",Tahoma,Arial,sans-serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font)}
  .wrap{max-width:1000px;margin:0 auto;padding:10px}
  .card{background:var(--bg);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.10)}
  .hd{display:flex;gap:10px;align-items:center;border-bottom:4px solid var(--ink);padding-bottom:10px}
  .hd .logo{width:42px;height:42px;border-radius:10px;background:var(--red);color:#fff;display:flex;
            align-items:center;justify-content:center;font-size:22px;font-weight:900}

  /* 一格一事：中文在上、用户语言在下；横屏两栏严格对齐 */
  .row{display:grid;grid-template-columns:1fr;gap:3px;padding:11px 0;border-bottom:2px solid var(--line);
       align-items:start;direction:ltr}
  .row .zh{font-size:clamp(21px,5.4vw,29px);font-weight:900;line-height:1.32}
  .row .zh .addr{display:block;font-size:clamp(24px,6.2vw,34px);color:var(--red);margin-top:4px}
  .row .zh .nm{display:block;font-size:clamp(17px,4.4vw,21px);color:var(--muted);margin-top:2px}
  .row .loc{font-size:clamp(14px,3.5vw,17px);font-weight:700;line-height:1.42;color:var(--muted)}
  .row .loc[dir="rtl"]{text-align:right}
  @media (min-width:640px) and (orientation:landscape){
    .row{grid-template-columns:1fr 1fr;gap:20px}
    .row .zh{padding-inline-end:18px;border-inline-end:3px solid var(--line)}
  }
  .sec{border-top:4px solid var(--ink);margin-top:14px;padding-top:10px}
  .sec .ttl{font-size:14px;font-weight:900;color:var(--muted);margin:0 0 8px}
  .sec .ttl b{color:var(--ink);font-size:15px}

  /* 导航链接：一个链接一个块 */
  a.nav{display:block;text-decoration:none;color:var(--ink);border:3px solid var(--ink);border-radius:12px;
        padding:10px 14px;margin-bottom:10px;background:#fff}
  a.nav.primary{background:var(--yellow)}
  a.nav .nzh{font-size:18px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px}
  a.nav .nloc{font-size:13px;font-weight:700;color:var(--muted);margin-top:2px}
  a.nav .note{font-size:12px;font-weight:700;color:#8A0011;margin-top:6px;line-height:1.35}

  /* 地铁 / 公交：只给「问店员的中文」+「地图怎么搜」，不编站名 */
  if(D.transport&&D.transport.length){
    app.insertAdjacentHTML('beforeend', sec('<b>地铁 / 公交</b> · '+esc(D.sec.transport),
      D.transport.map(function(x){
        return cell('<span class="ic">'+esc(x.icon)+'</span>'+esc(x.zh), x.local, '');
      }).join('')));
  }

  /* 二维码 */
  .qr{display:flex;gap:14px;align-items:center;border:3px solid var(--ink);border-radius:12px;padding:10px}
  .qr img{width:132px;height:132px;flex:0 0 auto;display:block}
  .qr .cap{display:grid;gap:2px}
  .qr .cap .zh{font-size:17px;font-weight:900}
  .qr .cap .loc{font-size:13px;font-weight:700;color:var(--muted)}

  /* 给司机看的大字块 */
  .taxi{border:5px solid var(--red);border-radius:14px;padding:12px;margin-top:10px;background:#FFF7F7}
  .taxi .zh{font-size:clamp(20px,5.2vw,26px);font-weight:900;line-height:1.35}
  .taxi .addr{font-size:clamp(30px,8.4vw,46px);font-weight:900;line-height:1.24;margin:8px 0 4px;
              letter-spacing:.5px;word-break:break-all}
  .taxi .nm{font-size:clamp(16px,4.2vw,20px);font-weight:800;color:var(--muted)}
  .taxi .loc{font-size:13px;font-weight:700;color:var(--muted);margin-top:6px;line-height:1.4}

  .btns{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
  .btn{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:10px 14px;border-radius:12px;
       border:3px solid var(--ink);background:#fff;color:var(--ink);font-family:inherit;cursor:pointer;
       text-align:start;font-size:16px}
  .btn .bi{font-size:21px}
  .btn .bl{flex:1 1 auto;display:grid;gap:1px}
  .btn .bzh{font-size:17px;font-weight:900;line-height:1.2}
  .btn .bloc{font-size:13px;font-weight:700;color:var(--muted);line-height:1.2}
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff}
  .btn.primary .bloc{color:#FFE9E9}
  .foot{margin-top:12px;font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
  .warn{background:#FFF1F1;border:3px solid var(--red);color:#8A0011;border-radius:12px;padding:10px 12px;
        margin-top:10px;font-size:15px;font-weight:800}
  @media print{.btns{display:none!important}body{background:#fff}}
  .ic{display:inline-block;margin-right:8px;font-size:1.05em}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app"></div></div>
<script id="card-data" type="application/json">/*__DATA__*/</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById('card-data').textContent);
  var U=D.ui||{}, app=document.getElementById('app');
  function esc(s){return String(s==null?'':s).replace(/\*\*/g,'').replace(/&/g,'&amp;')
      .replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function cell(zhHtml,local,cls){
    return '<div class="row '+(cls||'')+'"><div class="zh">'+zhHtml+'</div>'+
      '<div class="loc" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(local)+'</div></div>';
  }
  function sec(t,inner){return '<div class="sec"><div class="ttl">'+t+'</div>'+inner+'</div>';}

  var h='<div class="hd"><div class="logo">📍</div></div>';
  var gen=Date.parse(String(D.generatedAt||'').replace(' ','T'));
  if(!isNaN(gen)&&(Date.now()-gen)/60000>=30){h+='<div class="warn">⚠️ '+esc(U.stale)+'</div>';}

  /* 用法说明 */
  h+=cell(esc(D.howto.zh),D.howto.local);

  /* 门店：中文名与地址照抄接口原文 */
  h+=cell('<span class="nm">'+esc(D.store.nameZh)+'</span>'+
          '<span class="addr">'+esc(D.store.addressZh)+'</span>',
          D.store.local+' — '+D.store.addressLocal);

  app.innerHTML=h;

  /* 坐标（只有接口真给了才显示） */
  if(D.coords){
    app.insertAdjacentHTML('beforeend', cell('坐标 '+esc(D.coords.lat)+', '+esc(D.coords.lng),
      D.coords.local));
  }

  /* 导航链接 */
  var nav='';
  (D.links||[]).forEach(function(l){
    nav+='<a class="nav '+(l.primary?'primary':'')+'" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+
         '<div class="nzh"><span>'+esc(l.nameZh)+'</span><span>↗</span></div>'+
         '<div class="nloc" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(l.nameLocal)+'</div>'+
         (l.noteZh?'<div class="note">'+esc(l.noteZh)+' · '+esc(l.noteLocal)+'</div>':'')+
         '</a>';
  });
  app.insertAdjacentHTML('beforeend', sec('<b>怎么过去</b> · '+esc(D.sec.howToGo), nav));

  /* 二维码 */
  if(D.qr && D.qr.dataUri){
    app.insertAdjacentHTML('beforeend', sec('<b>扫一扫</b> · '+esc(D.sec.qr),
      '<div class="qr"><img alt="QR" src="'+D.qr.dataUri+'">'+
      '<div class="cap"><div class="zh">'+esc(D.qr.capZh)+'</div>'+
      '<div class="loc" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(D.qr.capLocal)+'</div></div></div>'));
  }

  /* 给司机看 */
  if(D.taxi){
    app.insertAdjacentHTML('beforeend', sec('<b>给出租车司机看</b> · '+esc(D.sec.taxi),
      '<div class="taxi"><div class="zh">'+esc(D.taxi.hello)+'</div>'+
      '<div class="addr">'+esc(D.taxi.addressZh)+'</div>'+
      '<div class="nm">'+esc(D.taxi.nameZh)+'</div>'+
      '<div class="loc" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(D.taxi.local)+'</div></div>'));
  }

  /* 朗读（读给司机听） */
  var bb=document.createElement('div'); bb.className='btns';
  var sp=document.createElement('button'); sp.className='btn primary';
  sp.innerHTML='<span class="bi">🔊</span><div class="bl"><span class="bzh">读出地址</span>'+
    '<span class="bloc" lang="'+D.lang+'" dir="'+D.dir+'">'+esc(U.speak)+'</span></div>';
  sp.onclick=function(){
    if(!('speechSynthesis' in window))return;
    var t=(D.taxi?D.taxi.hello:'')+(D.store.addressZh)+'。'+(D.store.nameZh)+'。';
    try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);
        u.lang='zh-CN';u.rate=0.8;window.speechSynthesis.speak(u);}catch(e){}
  };
  bb.appendChild(sp); app.appendChild(bb);

  var f=document.createElement('div'); f.className='foot';
  f.innerHTML=(D.isSample?esc(U.sampleNote)+' · ':'')+'🕒 '+esc(D.generatedAt)+' · mcspeak';
  app.appendChild(f);
  document.documentElement.setAttribute('lang',D.lang||'en');
})();
</script>
</body>
</html>
